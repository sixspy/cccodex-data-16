{% extends "base.html" %}
{% block title %}任务列表{% endblock %}
{% block body %}
<section class="card">
  <h1>采集任务</h1>
  <form class="grid-form" method="post" action="{{ url_for('jobs.create_job') }}">
    <label>任务名 <input name="name" placeholder="例：alpha 目录首轮" required /></label>
    <label>种子路径
      <select name="seed_path" required>
        {% for s in seeds %}
        <option value="{{ s }}">{{ s }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit">创建任务</button>
  </form>
</section>
<section class="card">
  <table>
    <thead>
      <tr>
        <th>ID</th><th>名称</th><th>种子</th><th>状态</th><th>记录数</th><th></th>
      </tr>
    </thead>
    <tbody>
      {% for j in jobs %}
      <tr>
        <td>{{ j.id }}</td>
        <td>{{ j.name }}</td>
        <td><code>{{ j.seed_path }}</code></td>
        <td><span class="tag {{ j.status }}">{{ j.status }}</span></td>
        <td>{{ counts.get(j.id, 0) }}</td>
        <td><a href="{{ url_for('jobs.detail', job_id=j.id) }}">详情</a></td>
      </tr>
      {% else %}
      <tr><td colspan="6" class="muted">尚无任务，请先创建</td></tr>
      {% endfor %}
    </tbody>
  </table>
</section>
<p class="muted">Mock 站点可在新标签打开：
  <a href="{{ url_for('mock.catalog', catalog_id='alpha') }}" target="_blank">alpha</a>
  ·
  <a href="{{ url_for('mock.catalog', catalog_id='beta') }}" target="_blank">beta</a>
</p>
{% endblock %}
